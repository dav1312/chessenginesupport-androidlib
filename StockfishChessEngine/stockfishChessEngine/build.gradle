plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kalab.chess.stockfishengine'
    compileSdk 35

    defaultConfig {
        applicationId "com.kalab.chess.stockfishengine"
        minSdk 21
        targetSdk 35
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
            keepDebugSymbols += "**/libstockfish.so"
        }
    }
}

dependencies {
    implementation project(':chessEngineSupportLibrary')
}
